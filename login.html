<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Horse Odds Calculator</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script>
    // ✅ Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDl7TW4J_yz8c-fJtE_trmcFRw1W0fcApA",
      authDomain: "horse-bet-calculator.firebaseapp.com",
      projectId: "horse-bet-calculator",
      appId: "1:258212871291:web:efcbb1d5715a9c9cd476de"
    };

    firebase.initializeApp(firebaseConfig);
    let redirecting = false;

    function getSafeNextPage() {
      const allowedPages = new Set(["index.html", "dashboard.html", "admin.html"]);
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (!next || !allowedPages.has(next)) return "index.html";
      return next;
    }

    function redirectAfterLogin() {
      if (redirecting) return;
      redirecting = true;
      const nextPage = getSafeNextPage();
      window.location.href = nextPage;
    }

    function preserveNextOnAuthLinks() {
      const nextPage = getSafeNextPage();
      const signupLink = document.getElementById("signupLink");
      if (!signupLink) return;
      signupLink.href = `signup.html?next=${encodeURIComponent(nextPage)}`;
    }

    function showAuthError(message) {
      const el = document.getElementById("authError");
      if (!el) return;
      el.textContent = message;
      el.style.display = "block";
    }

    function showLoggedOutMessage() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("loggedout") !== "1") return;
      const el = document.getElementById("logoutMsg");
      if (!el) return;
      el.style.display = "block";
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        redirectAfterLogin();
      }
    });

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const result = await firebase.auth().signInWithEmailAndPassword(email, password);
        console.log("✅ Logged in as:", result.user.email);
        redirectAfterLogin();
      } catch (err) {
        console.error("❌ Login error:", err);
        showAuthError("Login failed: " + err.message);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      preserveNextOnAuthLinks();
      showLoggedOutMessage();
    });
  </script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="logo.png" alt="Horse Odds Calculator logo" />
      <h1>Horse <span>Odds</span></h1>
      <p class="auth-sub">Log in to get back to the track.</p>
    </div>

    <div id="logoutMsg" class="auth-success" style="display:none;">
      You've been logged out. See you at the track. 🏇
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); login();">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      </div>
      <div id="authError" class="auth-error"></div>
      <button type="submit">Log In</button>
    </form>

    <p class="auth-switch">
      Need an account?
      <a id="signupLink" href="signup.html">Sign up</a>
    </p>
    <p class="auth-back"><a href="index.html">← Back to Calculator</a></p>
  </main>
</body>
</html>
