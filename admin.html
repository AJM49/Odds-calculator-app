<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Horse Odds Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>🐎 Admin Dashboard</h1>
  <div id="adminStatus">Checking admin access...</div>
  <div id="adminContent" style="display:none;">

    <section id="dashboardCards" style="display: flex; gap: 20px; flex-wrap: wrap;">
      <div class="card">
        <h3>Total Users</h3>
        <p id="totalUsers">0</p>
      </div>
      <div class="card">
        <h3>Total Bets</h3>
        <p id="totalBets">0</p>
      </div>
      <div class="card">
        <h3>Total Wagered</h3>
        <p id="totalWagered">$0.00</p>
      </div>
    </section>


    <h2>👤 Users</h2>
    <table id="usersTable" border="1">
      <thead>
        <tr>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>🧾 Bets</h2>
    <table id="betsTable" border="1">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Bet Type</th>
          <th>Amount</th>
          <th>Odds</th>
          <th>Timestamp</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDl7TW4J_yz8c-fJtE_trmcFRw1W0fcApA",
      authDomain: "horse-bet-calculator.firebaseapp.com",
      projectId: "horse-bet-calculator",
      appId: "1:258212871291:web:efcbb1d5715a9c9cd476de"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = "login.html?next=admin.html";
        return;
      }
      const doc = await db.collection('users').doc(user.uid).get();
      const data = doc.data();
      if (data && data.role === 'admin') {
        document.getElementById('adminStatus').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadUsers();
        loadBets();
      } else {
        document.getElementById('adminStatus').innerText = 'Access denied. Not an admin.';
      }
    });

    async function loadUsers() {
      const snapshot = await db.collection('users').get();
      const tbody = document.getElementById('usersTable').querySelector('tbody');
      tbody.innerHTML = '';
      document.getElementById('totalUsers').textContent = String(snapshot.size);
      snapshot.forEach(doc => {
        const data = doc.data();
        const row = document.createElement('tr');

        // Render user-provided data with textContent to avoid HTML injection.
        const emailCell = document.createElement('td');
        emailCell.textContent = data.email || '—';

        const roleCell = document.createElement('td');
        roleCell.textContent = data.role || 'user';

        const actionsCell = document.createElement('td');
        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'Delete';
        deleteButton.addEventListener('click', () => deleteUser(doc.id));
        actionsCell.appendChild(deleteButton);

        row.appendChild(emailCell);
        row.appendChild(roleCell);
        row.appendChild(actionsCell);
        tbody.appendChild(row);
      });
    }

    function formatTimestamp(value) {
      if (!value || typeof value.toDate !== 'function') {
        return 'Time pending';
      }
      const date = value.toDate();
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
        return 'Time pending';
      }
      return date.toLocaleString();
    }

    async function loadBets() {
      const snapshot = await db.collection('bets').get();
      const tbody = document.getElementById('betsTable').querySelector('tbody');
      tbody.innerHTML = '';
      document.getElementById('totalBets').textContent = String(snapshot.size);
      let totalWagered = 0;
      snapshot.forEach(doc => {
        const data = doc.data();
        totalWagered += parseFloat(data.betAmount || 0);
        const row = document.createElement('tr');

        // Render each cell safely instead of template HTML injection.
        const userIdCell = document.createElement('td');
        userIdCell.textContent = data.userId || '—';

        const betTypeCell = document.createElement('td');
        betTypeCell.textContent = data.betType || '—';

        const amountCell = document.createElement('td');
        amountCell.textContent = `$${parseFloat(data.betAmount || 0).toFixed(2)}`;

        const oddsCell = document.createElement('td');
        oddsCell.textContent = data.odds || '—';

        const timestampCell = document.createElement('td');
        timestampCell.textContent = formatTimestamp(data.timestamp);

        const actionsCell = document.createElement('td');
        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'Delete';
        deleteButton.addEventListener('click', () => deleteBet(doc.id));
        actionsCell.appendChild(deleteButton);

        row.appendChild(userIdCell);
        row.appendChild(betTypeCell);
        row.appendChild(amountCell);
        row.appendChild(oddsCell);
        row.appendChild(timestampCell);
        row.appendChild(actionsCell);
        tbody.appendChild(row);
      });
      document.getElementById('totalWagered').textContent = `$${totalWagered.toFixed(2)}`;
    }

    async function deleteUser(uid) {
      if (confirm("Are you sure you want to delete this user from Firestore?")) {
        await db.collection('users').doc(uid).delete();
        loadUsers();
      }
    }

    async function deleteBet(betId) {
      if (confirm("Are you sure you want to delete this bet?")) {
        await db.collection('bets').doc(betId).delete();
        loadBets();
      }
    }
  </script>
</body>
</html>
