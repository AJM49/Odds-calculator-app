<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Horse Odds Calculator</title>
  <link rel="stylesheet" href="style.css" />

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    // Firebase config (same as other pages)
    const firebaseConfig = {
      apiKey: "AIzaSyDl7TW4J_yz8c-fJtE_trmcFRw1W0fcApA",
      authDomain: "horse-bet-calculator.firebaseapp.com",
      projectId: "horse-bet-calculator",
      appId: "1:258212871291:web:efcbb1d5715a9c9cd476de"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function getSafeNextPage() {
      const allowedPages = new Set(["index.html", "dashboard.html", "admin.html"]);
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (!next || !allowedPages.has(next)) return "index.html";
      return next;
    }

    function preserveNextOnAuthLinks() {
      const nextPage = getSafeNextPage();
      const loginLink = document.getElementById("loginLink");
      if (!loginLink) return;
      loginLink.href = `login.html?next=${encodeURIComponent(nextPage)}`;
    }

    function showAuthError(message) {
      const el = document.getElementById("authError");
      if (!el) return;
      el.textContent = message;
      el.style.display = "block";
    }

    firebase.auth().onAuthStateChanged((user) => {
      if (!user) return;
      const nextPage = getSafeNextPage();
      window.location.href = nextPage;
    });

    async function signUp() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const result = await firebase.auth().createUserWithEmailAndPassword(email, password);
        console.log("✅ Sign up successful:", result.user.email);

        // Ensure user profile exists for role-based checks used by admin flow.
        await db.collection("users").doc(result.user.uid).set(
          { email: result.user.email, role: "user", createdAtMs: Date.now() },
          { merge: true }
        );

        const nextPage = getSafeNextPage();
        window.location.href = nextPage;
      } catch (err) {
        console.error("❌ Sign up error:", err);
        showAuthError("Sign up failed: " + err.message);
      }
    }

    window.addEventListener("DOMContentLoaded", preserveNextOnAuthLinks);
  </script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="logo.png" alt="Horse Odds Calculator logo" />
      <h1>Horse <span>Odds</span></h1>
      <p class="auth-sub">Create your account and start tracking bets.</p>
    </div>

    <form id="signupForm" onsubmit="event.preventDefault(); signUp();">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password (6+ characters)" autocomplete="new-password" required />
      </div>
      <div id="authError" class="auth-error"></div>
      <button type="submit">Sign Up</button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a id="loginLink" href="login.html">Log in</a>
    </p>
    <p class="auth-back"><a href="index.html">← Back to Calculator</a></p>
  </main>
</body>
</html>
